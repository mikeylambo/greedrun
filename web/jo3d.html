<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jo: Greedrun — 3D Model Test</title>
<style>
  :root{ --gold:#f5c542; --scarf:#ffcf3f; --bone:#e8ddc7; --muted:#9a8b6d; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0a0906; color:var(--bone);
    font-family:"Barlow Semi Condensed",system-ui,sans-serif; overflow:hidden; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }
  .hud{ position:fixed; pointer-events:none; z-index:5; }
  #top{ top:14px; left:0; right:0; text-align:center; }
  #top .title{ font-family:"Cinzel",serif; font-weight:700; letter-spacing:.18em;
    font-size:15px; color:var(--scarf); text-transform:uppercase; text-shadow:0 2px 18px rgba(0,0,0,.7); }
  #top .sub{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  #haul{ top:16px; right:18px; left:auto; text-align:right; }
  #haul .lbl{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  #haul .val{ font-family:"Cinzel",serif; font-weight:700; font-size:26px; color:var(--gold);
    text-shadow:0 0 26px rgba(245,197,66,.45); line-height:1; }
  #load{ position:fixed; left:18px; bottom:44px; width:190px; z-index:5; pointer-events:none; }
  #load .lbl{ display:flex; justify-content:space-between; font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  #load .bar{ height:7px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
  #load .fill{ height:100%; width:0; border-radius:5px;
    background:linear-gradient(90deg,var(--scarf),#c8901f); transition:width .2s ease-out; }
  #hint{ left:0; right:0; bottom:14px; text-align:center; font-size:12px; letter-spacing:.05em; color:var(--muted); }
  #hint b{ color:var(--bone); font-weight:600; }
  #badge{ position:fixed; left:16px; top:14px; z-index:5; pointer-events:none;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:5px 11px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="badge">Web · Three.js · procedural rig</div>
<div class="hud" id="top">
  <div class="title">Jo — 3D Model Test</div>
  <div class="sub">a rigged character from the reference · not the sprite</div>
</div>
<div class="hud" id="haul">
  <div class="lbl">Haul in bag</div>
  <div class="val" id="haulVal">$0</div>
</div>
<div id="load">
  <div class="lbl"><span>Greed load</span><span id="loadTxt">Light</span></div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
</div>
<div class="hud" id="hint"><b>Drag anywhere</b> or <b>WASD / arrows</b> to move Jo · grab the gold</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";
const T = THREE;

// ---------- palette (matched to the reference art) ----------
const COL = {
  outfit:   0x1a1712,   // near-black cloth
  outfitLo: 0x110f0b,   // shadowed cloth / pants
  glove:    0x0b0a08,   // gloves / boots
  scarf:    0xffcf3f,   // signature gold scarf
  band:     0x3f6fd6,   // blue headband
  hair:     0x14110d,   // black spiky hair
  skin:     0xe0b088,   // face
  strap:    0x3a2c18,   // leather straps / belt
  bag:      0x7c5a30,   // loot sack
  bagDk:    0x5a3f20,
  coin:     0xffcf3f,
  floor:    0x15120c,
};

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new T.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
app.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x080604);
scene.fog = new T.Fog(0x080604, 26, 62);

const camera = new T.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 200);
const camOffset = new T.Vector3(0, 7.2, 8.4);   // 3/4 look-down
camera.position.copy(camOffset);
camera.lookAt(0,1,0);

// ---------- lighting ----------
scene.add(new T.HemisphereLight(0x4a4860, 0x080604, 0.32));
const key = new T.DirectionalLight(0xffe1a6, 1.7);
key.position.set(7, 13, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 48;
key.shadow.camera.left=-14; key.shadow.camera.right=14;
key.shadow.camera.top=14; key.shadow.camera.bottom=-14;
key.shadow.bias = -0.0004; key.shadow.radius = 3;
scene.add(key); scene.add(key.target);
const rim = new T.DirectionalLight(0x6f83c0, 0.4); rim.position.set(-6, 6, -8); scene.add(rim);
const warm = new T.PointLight(0xffb867, 0.5, 16, 2); warm.position.set(0, 2.4, 0); // Jo's "lantern" mood

// ---------- world ----------
const floorMat = new T.MeshStandardMaterial({ color:0x0f0c08, roughness:1.0, metalness:0.0 });
const floor = new T.Mesh(new T.PlaneGeometry(120,120), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const grid = new T.GridHelper(80, 80, 0x33291a, 0x1c160e);
grid.position.y = 0.02; grid.material.opacity = 0.28; grid.material.transparent = true; scene.add(grid);

const BOUND = 22;
// a few pillars for depth / shadow interest
const pillarMat = new T.MeshStandardMaterial({ color:0x241d13, roughness:0.9 });
for(const [px,pz] of [[-9,-7],[8,-9],[-11,6],[10,7],[0,-13]]){
  const h = 3 + Math.random()*2.5;
  const p = new T.Mesh(new T.BoxGeometry(1.4, h, 1.4), pillarMat);
  p.position.set(px, h/2, pz); p.castShadow = true; p.receiveShadow = true; scene.add(p);
  const cap = new T.Mesh(new T.BoxGeometry(1.7,0.3,1.7), pillarMat);
  cap.position.set(px, h+0.15, pz); cap.castShadow=true; scene.add(cap);
}

// ---------- material helpers ----------
const mat = (c, rough=0.85, metal=0.0)=> new T.MeshStandardMaterial({ color:c, roughness:rough, metalness:metal });
function mesh(geo, m, cast=true){ const e=new T.Mesh(geo,m); e.castShadow=cast; e.receiveShadow=true; return e; }
// a joint pivot with a limb hanging below it (rotate pivot.rotation.x to swing)
function limb(len, rTop, rBot, m){
  const g = new T.Group();
  const seg = mesh(new T.CylinderGeometry(rTop, rBot, len, 10), m);
  seg.position.y = -len/2; g.add(seg);
  g.userData.len = len; return g;
}

// ---------- build Jo ----------
const rig = {};
const root = new T.Group(); scene.add(root);      // world position + facing (yaw)
root.add(warm);
const body = new T.Group(); root.add(body);        // bob / lean / roll
rig.root = root; rig.body = body;

const mOutfit = mat(COL.outfit, 0.82), mPants = mat(COL.outfitLo, 0.9),
      mGlove = mat(COL.glove, 0.7),
      mScarf = new T.MeshStandardMaterial({ color:COL.scarf, roughness:0.5, emissive:0x6a4d05, emissiveIntensity:0.55 }),
      mHair = mat(COL.hair, 0.5), mSkin = mat(COL.skin, 0.72),
      mStrap = mat(COL.strap, 0.8), mBand = mat(COL.band, 0.45), mBoot = mat(COL.glove, 0.6);

const HIP_Y = 0.92, SHO_Y = 1.66;

// pelvis + torso
const pelvis = mesh(new T.CylinderGeometry(0.30,0.26,0.24,12), mPants); pelvis.position.y = HIP_Y; body.add(pelvis);
const torso = mesh(new T.CylinderGeometry(0.28,0.32,0.62,12), mOutfit); torso.position.y = HIP_Y+0.44; body.add(torso);
const chest = mesh(new T.SphereGeometry(0.30,14,12), mOutfit); chest.position.y = SHO_Y-0.12; chest.scale.set(1,0.8,0.9); body.add(chest);
// belt + diagonal strap
const belt = mesh(new T.TorusGeometry(0.30,0.055,8,20), mStrap); belt.position.y=HIP_Y+0.14; belt.rotation.x=Math.PI/2; body.add(belt);
const buckle = mesh(new T.BoxGeometry(0.13,0.10,0.05), mScarf); buckle.position.set(0,HIP_Y+0.14,0.31); body.add(buckle);
// crossed bandolier straps (signature) — front and back so they read from every angle
for(const [rz, zside] of [[0.55,0.30],[-0.55,0.30],[0.55,-0.30],[-0.55,-0.30]]){
  const st = mesh(new T.BoxGeometry(0.075,1.05,0.04), mStrap);
  st.position.set(0, HIP_Y+0.58, zside); st.rotation.z = rz; body.add(st);
}

// head assembly (bobs a touch on its own)
const head = new T.Group(); head.position.y = SHO_Y+0.10; body.add(head); rig.head = head;
const skull = mesh(new T.SphereGeometry(0.245,18,16), mSkin); skull.scale.set(1,1.05,0.98); head.add(skull);
const face = mesh(new T.SphereGeometry(0.246,18,16), mSkin); // (kept simple; eyes below)
// eyes
for(const sx of [-1,1]){
  const eye = mesh(new T.SphereGeometry(0.032,8,8), mat(0x141414,0.4)); eye.position.set(sx*0.085,0.02,0.225); head.add(eye);
}
// headband (blue) + knot
const band = mesh(new T.TorusGeometry(0.245,0.045,8,22), mBand); band.position.set(0,0.10,0); band.rotation.x=Math.PI/2; band.scale.set(1,0.85,1); head.add(band);
const knot = mesh(new T.BoxGeometry(0.10,0.08,0.06), mBand); knot.position.set(-0.22,0.11,-0.06); head.add(knot);
// spiky black hair
const hairBase = mesh(new T.SphereGeometry(0.255,16,14), mHair); hairBase.position.y=0.10; hairBase.scale.set(1.03,0.9,1.03);
// clip lower hemisphere by pushing base up a bit; add spikes
head.add(hairBase);
const spikeSpots = [[0,0.30,-0.02,0.1],[-0.14,0.27,0.02,-0.4],[0.15,0.26,0.0,0.5],
  [-0.05,0.28,-0.16,-0.2],[0.08,0.25,-0.17,0.3],[-0.20,0.20,-0.06,-0.8],[0.21,0.19,-0.05,0.8],
  [0.02,0.22,0.16,0.05],[-0.12,0.20,0.14,-0.3]];
for(const [x,y,z,tilt] of spikeSpots){
  const s = mesh(new T.ConeGeometry(0.085,0.30,6), mHair);
  s.position.set(x,y,z); s.rotation.z = tilt; s.rotation.x = -0.3 + (z<0?-0.5:0.2); head.add(s);
}

// scarf: collar + trailing tail (animated)
const collar = mesh(new T.TorusGeometry(0.235,0.075,8,20), mScarf); collar.position.y=SHO_Y-0.01; collar.rotation.x=Math.PI/2; collar.scale.set(1,0.9,1); body.add(collar);
const knotF = mesh(new T.SphereGeometry(0.10,10,10), mScarf); knotF.position.set(0.16, SHO_Y-0.06, 0.16); body.add(knotF);
// flowing tail: a chain of ribbon segments that hang down at rest and stream
// out behind Jo as he moves (rotation.x: ~0 hangs, ~+1.3 points straight back)
const scarf = new T.Group(); scarf.position.set(0.12, SHO_Y-0.06, -0.15); body.add(scarf); rig.scarf = [];
{
  let parent = scarf;
  for(let i=0;i<6;i++){
    const seg = new T.Group();
    const w = 0.24 - i*0.028;
    const panel = mesh(new T.BoxGeometry(w, 0.22, 0.05), mScarf);
    panel.position.y = -0.11; seg.add(panel);                         // hangs below the joint
    seg.position.set(0, i===0? -0.06 : -0.20, i===0? -0.08 : -0.03);
    seg.rotation.x = -0.05;                                           // resting droop
    parent.add(seg); rig.scarf.push(seg); parent = seg;
  }
}

// loot bag on the back (scales with load)
const bag = new T.Group(); bag.position.set(0.05, SHO_Y-0.35, -0.34); body.add(bag); rig.bag = bag;
const sack = mesh(new T.SphereGeometry(0.26,14,12), mat(COL.bag,0.95)); sack.scale.set(1,1.12,0.9); bag.add(sack);
const sackTie = mesh(new T.TorusGeometry(0.12,0.035,8,16), mat(COL.bagDk,0.9)); sackTie.position.y=0.24; sackTie.rotation.x=Math.PI/2; bag.add(sackTie);
bag.scale.setScalar(0.55);

// arms (shoulder pivot -> upper -> elbow -> forearm -> glove)
function arm(side){
  const sho = new T.Group(); sho.position.set(side*0.34, SHO_Y-0.04, 0); body.add(sho);
  const upper = limb(0.42, 0.10, 0.085, mOutfit); sho.add(upper);
  const elbow = new T.Group(); elbow.position.y = -0.42; sho.add(elbow);
  const fore = limb(0.40, 0.085, 0.07, mOutfit); elbow.add(fore);
  const glove = mesh(new T.SphereGeometry(0.10,10,10), mGlove); glove.position.y=-0.40; glove.scale.set(1,1.1,1); elbow.add(glove);
  return { sho, elbow };
}
rig.armL = arm(-1); rig.armR = arm(1);

// legs (hip pivot -> thigh -> knee -> shin -> boot)
function leg(side){
  const hip = new T.Group(); hip.position.set(side*0.14, HIP_Y-0.04, 0); body.add(hip);
  const thigh = limb(0.44, 0.13, 0.11, mPants); hip.add(thigh);
  const knee = new T.Group(); knee.position.y = -0.44; hip.add(knee);
  const shin = limb(0.44, 0.10, 0.085, mPants); knee.add(shin);
  const boot = mesh(new T.BoxGeometry(0.20,0.16,0.34), mBoot); boot.position.set(0,-0.46,0.06); knee.add(boot);
  return { hip, knee };
}
rig.legL = leg(-1); rig.legR = leg(1);

root.position.set(0, 0, 0);

// ---------- loot coins ----------
const coins = [];
const coinGeo = new T.CylinderGeometry(0.22,0.22,0.06,18);
const coinMat = new T.MeshStandardMaterial({ color:COL.coin, roughness:0.35, metalness:0.7, emissive:0x5a3d00, emissiveIntensity:0.6 });
function scatterCoins(n){
  for(let i=0;i<n;i++){
    const c = mesh(coinGeo, coinMat); c.rotation.x = Math.PI/2;
    const holder = new T.Group();
    let x,z; do{ x=(Math.random()*2-1)*15; z=(Math.random()*2-1)*15; }while(Math.hypot(x,z)<2.5);
    holder.position.set(x, 0.5, z); holder.add(c);
    // glow disc under coin
    const glow = new T.Mesh(new T.CircleGeometry(0.5,20), new T.MeshBasicMaterial({color:0xffcf3f, transparent:true, opacity:0.12}));
    glow.rotation.x=-Math.PI/2; glow.position.set(x,0.03,z); scene.add(glow);
    holder.userData.glow = glow; scene.add(holder); coins.push(holder);
  }
}
scatterCoins(24);

// ---------- input ----------
const keys = new Set();
addEventListener('keydown', e=>{ keys.add(e.key.toLowerCase()); });
addEventListener('keyup',   e=>{ keys.delete(e.key.toLowerCase()); });
let drag=null; const touchVec={x:0,y:0};
const el = renderer.domElement;
el.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY}; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e=>{ if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y, m=Math.hypot(dx,dy)||1, s=Math.min(1,m/70);
  touchVec.x=dx/m*s; touchVec.y=dy/m*s; });
function endDrag(){ drag=null; touchVec.x=touchVec.y=0; }
el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);

// ---------- state ----------
let haul=0, load=0, walkPhase=0, yaw=0;
const SPEED = 5.2;                       // units / sec
const $=id=>document.getElementById(id);
function setLoad(n){
  load=n; rig.bag.scale.setScalar(0.55 + Math.min(load,40)*0.02);
  $('loadFill').style.width = Math.min(100, load/40*100)+'%';
  $('loadTxt').textContent = load<6?'Light': load<16?'Laden': load<28?'Heavy':'Backbreaking';
}

// ---------- animation ----------
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(2*Math.PI))-Math.PI; return a+d*t; }
function animateRig(dt, speedFrac){
  const B = rig.body;
  if(speedFrac>0.02){
    // stride cadence locked to distance so feet never skate
    walkPhase += speedFrac*SPEED*dt*3.4;
    const p = walkPhase, amp = 0.55*Math.min(1,speedFrac+0.3);
    // legs (opposite phase), knees bend on the back-swing
    rig.legL.hip.rotation.x = Math.sin(p)*amp;
    rig.legR.hip.rotation.x = Math.sin(p+Math.PI)*amp;
    rig.legL.knee.rotation.x = Math.max(0,-Math.sin(p-0.5))*1.15;
    rig.legR.knee.rotation.x = Math.max(0,-Math.sin(p+Math.PI-0.5))*1.15;
    // arms swing opposite the legs, slight elbow bend
    rig.armL.sho.rotation.x = Math.sin(p+Math.PI)*amp*0.9;
    rig.armR.sho.rotation.x = Math.sin(p)*amp*0.9;
    rig.armL.elbow.rotation.x = -0.3 - Math.max(0,Math.sin(p))*0.4;
    rig.armR.elbow.rotation.x = -0.3 - Math.max(0,Math.sin(p+Math.PI))*0.4;
    // body: 2-per-stride bob, forward lean, side roll
    B.position.y = Math.abs(Math.sin(p))*0.07;
    B.rotation.x = 0.10*speedFrac;
    B.rotation.z = Math.sin(p)*0.035;
    rig.head.rotation.z = -Math.sin(p)*0.02;
  } else {
    // ease everything back to rest + gentle idle breathing
    const k = 1-Math.pow(0.001,dt);
    for(const j of [rig.legL.hip,rig.legR.hip,rig.legL.knee,rig.legR.knee,rig.armL.sho,rig.armR.sho]) j.rotation.x += (0-j.rotation.x)*k;
    rig.armL.elbow.rotation.x += (-0.25-rig.armL.elbow.rotation.x)*k;
    rig.armR.elbow.rotation.x += (-0.25-rig.armR.elbow.rotation.x)*k;
    const br = Math.sin(performance.now()*0.0022);
    B.position.y += (0 - B.position.y)*k;
    B.rotation.x += (0 - B.rotation.x)*k;
    B.rotation.z += (0 - B.rotation.z)*k;
    B.scale.y = 1 + br*0.012;
    rig.head.rotation.z += (0-rig.head.rotation.z)*k;
    walkPhase = 0;
  }
  // scarf: hangs at rest, swings up to stream behind with speed, always fluttering
  const t = performance.now()*0.004;
  const lift = speedFrac*1.25;                     // 0 = hangs down, ~1.25 = streams out behind
  for(let i=0;i<rig.scarf.length;i++){
    const s = rig.scarf[i];
    s.rotation.y = Math.sin(t*1.1 - i*0.6)*0.09*(0.6+i*0.14);
    s.rotation.x = -0.05 + lift + Math.sin(t*1.4 - i*0.7)*0.09*(1+i*0.26);
  }
}

// ---------- main loop ----------
let last = performance.now();
function tick(now){
  const dt = Math.min(0.033,(now-last)/1000); last=now;
  // input -> world XZ
  let ix=0, iz=0;
  if(keys.has('w')||keys.has('arrowup')) iz-=1;
  if(keys.has('s')||keys.has('arrowdown')) iz+=1;
  if(keys.has('a')||keys.has('arrowleft')) ix-=1;
  if(keys.has('d')||keys.has('arrowright')) ix+=1;
  ix += touchVec.x; iz += touchVec.y;
  let m = Math.hypot(ix,iz); let speedFrac=0;
  if(m>0.03){
    if(m>1){ ix/=m; iz/=m; m=1; }
    speedFrac = m;
    root.position.x = Math.max(-BOUND, Math.min(BOUND, root.position.x + ix*SPEED*dt));
    root.position.z = Math.max(-BOUND, Math.min(BOUND, root.position.z + iz*SPEED*dt));
    yaw = lerpAngle(yaw, Math.atan2(ix,iz), 1-Math.pow(0.0001,dt)); // face movement (model faces +Z)
  }
  root.rotation.y = yaw;
  animateRig(dt, speedFrac);

  // coins: spin, glow-pulse, collect
  for(const c of coins){ if(!c.visible) continue;
    c.children[0].rotation.z += dt*2.2;
    c.position.y = 0.5 + Math.sin(now*0.004 + c.position.x)*0.06;
    const dx=c.position.x-root.position.x, dz=c.position.z-root.position.z;
    if(dx*dx+dz*dz < 1.3){ c.visible=false; if(c.userData.glow) c.userData.glow.visible=false;
      haul += 60; setLoad(load+1); $('haulVal').textContent='$'+haul.toLocaleString(); }
  }

  // camera follows Jo at the 3/4 offset
  const desired = new T.Vector3().copy(root.position).add(camOffset);
  camera.position.lerp(desired, 1-Math.pow(0.002,dt));
  camera.lookAt(root.position.x, 1.1, root.position.z);
  key.target.position.set(root.position.x, 0, root.position.z);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
})();
</script>
</body>
</html>

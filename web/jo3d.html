<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jo: Greedrun — 3D Model Test</title>
<style>
  :root{ --gold:#f5c542; --scarf:#ffcf3f; --bone:#e8ddc7; --muted:#9a8b6d; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0a0906; color:var(--bone);
    font-family:"Barlow Semi Condensed",system-ui,sans-serif; overflow:hidden; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }
  .hud{ position:fixed; pointer-events:none; z-index:5; }
  #top{ top:14px; left:0; right:0; text-align:center; }
  #top .title{ font-family:"Cinzel",serif; font-weight:700; letter-spacing:.18em;
    font-size:15px; color:var(--scarf); text-transform:uppercase; text-shadow:0 2px 18px rgba(0,0,0,.7); }
  #top .sub{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
  #haul{ top:16px; right:18px; left:auto; text-align:right; }
  #haul .lbl{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  #haul .val{ font-family:"Cinzel",serif; font-weight:700; font-size:26px; color:var(--gold);
    text-shadow:0 0 26px rgba(245,197,66,.45); line-height:1; }
  #load{ position:fixed; left:18px; bottom:44px; width:190px; z-index:5; pointer-events:none; }
  #load .lbl{ display:flex; justify-content:space-between; font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  #load .bar{ height:7px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
  #load .fill{ height:100%; width:0; border-radius:5px;
    background:linear-gradient(90deg,var(--scarf),#c8901f); transition:width .2s ease-out; }
  #hint{ left:0; right:0; bottom:14px; text-align:center; font-size:12px; letter-spacing:.05em; color:var(--muted); }
  #hint b{ color:var(--bone); font-weight:600; }
  #badge{ position:fixed; left:16px; top:14px; z-index:5; pointer-events:none;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:5px 11px; }
  /* locomotion state readout — shows the animation system working */
  #state{ position:fixed; right:18px; bottom:40px; width:150px; z-index:5; pointer-events:none; text-align:right; }
  #state .st{ font-family:"Cinzel",serif; font-weight:700; font-size:15px; letter-spacing:.1em; color:var(--bone); }
  #state .src{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  #state .bar{ height:5px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:6px; }
  #state .fill{ height:100%; width:0; background:linear-gradient(90deg,#6f83c0,#9fd0ff); border-radius:4px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="badge">Web · Three.js · locomotion system</div>
<div class="hud" id="top">
  <div class="title">Jo — 3D Model Test</div>
  <div class="sub">rig-agnostic animation system · drop in a model, it inherits the motion</div>
</div>
<div class="hud" id="haul">
  <div class="lbl">Haul in bag</div>
  <div class="val" id="haulVal">$0</div>
</div>
<div id="load">
  <div class="lbl"><span>Greed load</span><span id="loadTxt">Light</span></div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
</div>
<div id="state">
  <div class="st" id="stateName">IDLE</div>
  <div class="src" id="stateSrc">primitive rig</div>
  <div class="bar"><div class="fill" id="stateFill"></div></div>
</div>
<div class="hud" id="hint"><b>Drag anywhere</b> or <b>WASD / arrows</b> to move Jo · grab the gold</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
(function(){
"use strict";
const T = THREE;
const clamp = (v,a,b)=> v<a?a: v>b?b: v;
const smoothstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const damp = (cur,tgt,rate,dt)=> cur + (tgt-cur)*(1-Math.exp(-rate*dt)); // frame-rate-independent easing
const dampAngle = (cur,tgt,rate,dt)=>{ let d=((tgt-cur+Math.PI)%(2*Math.PI))-Math.PI; return cur + d*(1-Math.exp(-rate*dt)); };

// ================================================================
//  SCENE / RENDER / CAMERA / LIGHTS / WORLD
// ================================================================
const app = document.getElementById('app');
const renderer = new T.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
app.appendChild(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0x080604);
scene.fog = new T.Fog(0x080604, 26, 62);

const camera = new T.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
const camOffset = new T.Vector3(0, 7.2, 8.4);
camera.position.copy(camOffset); camera.lookAt(0,1,0);

scene.add(new T.HemisphereLight(0x4a4860, 0x080604, 0.32));
const key = new T.DirectionalLight(0xffe1a6, 1.7);
key.position.set(7,13,6); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=1; key.shadow.camera.far=48;
key.shadow.camera.left=-14; key.shadow.camera.right=14; key.shadow.camera.top=14; key.shadow.camera.bottom=-14;
key.shadow.bias=-0.0004; key.shadow.radius=3; scene.add(key); scene.add(key.target);
const rim = new T.DirectionalLight(0x6f83c0, 0.4); rim.position.set(-6,6,-8); scene.add(rim);

const floor = new T.Mesh(new T.PlaneGeometry(120,120), new T.MeshStandardMaterial({color:0x0f0c08, roughness:1}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid = new T.GridHelper(80,80,0x33291a,0x1c160e); grid.position.y=0.02;
grid.material.opacity=0.28; grid.material.transparent=true; scene.add(grid);
const BOUND = 22;
const pillarMat = new T.MeshStandardMaterial({color:0x241d13, roughness:0.9});
for(const [px,pz] of [[-9,-7],[8,-9],[-11,6],[10,7],[0,-13]]){
  const h=3+Math.random()*2.5;
  const p=new T.Mesh(new T.BoxGeometry(1.4,h,1.4), pillarMat); p.position.set(px,h/2,pz); p.castShadow=p.receiveShadow=true; scene.add(p);
  const cap=new T.Mesh(new T.BoxGeometry(1.7,0.3,1.7), pillarMat); cap.position.set(px,h+0.15,pz); cap.castShadow=true; scene.add(cap);
}

// ================================================================
//  LOCOMOTION SOLVER  — the single source of truth for the walk.
//  Turns (speed01, stridePhase) into a rig-agnostic pose. Both the
//  primitive rig and a bare-boned glTF are driven from THIS, so the
//  motion is identical no matter what mesh is on screen.
// ================================================================
function solveLocomotion(speed01, phase, tSec){
  const act  = clamp(speed01/0.12, 0, 1);            // activity: fully walking by ~12% of top speed
  const run  = smoothstep(0.55, 1.0, speed01);       // 0 = walk .. 1 = run
  const amp  = (0.34 + 0.34*speed01) * act;          // leg swing grows with speed
  const aAmp = (0.30 + 0.55*speed01) * act;          // arm swing
  const s = Math.sin(phase), s2 = Math.sin(phase+Math.PI);
  const kneeGain = 0.9 + 0.55*run;
  return {
    hip:      [ s*amp, s2*amp ],
    knee:     [ Math.max(0,-Math.sin(phase-0.5))*kneeGain*act,
                Math.max(0,-Math.sin(phase+Math.PI-0.5))*kneeGain*act ],
    shoulder: [ s2*aAmp, s*aAmp ],
    elbow:    [ -0.25 - Math.max(0, s )*0.45*act,
                -0.25 - Math.max(0, s2)*0.45*act ],
    bobY:     Math.abs(s)*(0.05+0.035*speed01)*act,
    leanX:    (0.06 + 0.11*run)*speed01,
    rollZ:    s*0.035*act,
    headZ:    -s*0.02*act,
    scarfLift: speed01*1.25,
    breathe:  (1-act)*Math.sin(tSec*2.2)*0.012,
  };
}

// ================================================================
//  ACTORS — each wraps a body + knows how to render one frame of
//  locomotion. All expose: { root(Object3D to move/turn), bag?, update(dt, loco) }
//  loco = { speed01, phase, tSec, state }
// ================================================================

// palette + helpers for the built-from-primitives Jo
const COL = { outfit:0x1a1712, pants:0x110f0b, glove:0x0b0a08, scarf:0xffcf3f, band:0x3f6fd6,
              hair:0x14110d, skin:0xe0b088, strap:0x3a2c18, bag:0x7c5a30, bagDk:0x5a3f20 };
const mat=(c,r=0.85,m=0)=> new T.MeshStandardMaterial({color:c, roughness:r, metalness:m});
function pmesh(g,m,cast=true){ const e=new T.Mesh(g,m); e.castShadow=cast; e.receiveShadow=true; return e; }
const at=(e,x,y,z)=>{ e.position.set(x,y,z); return e; };
function limb(len,rT,rB,m){ const g=new T.Group(); const seg=pmesh(new T.CylinderGeometry(rT,rB,len,10),m); seg.position.y=-len/2; g.add(seg); return g; }

function PrimitiveActor(){
  const root = new T.Group(); scene.add(root);
  const warm = new T.PointLight(0xffb867,0.5,16,2); warm.position.set(0,2.4,0); root.add(warm);
  const body = new T.Group(); root.add(body);
  const mOutfit=mat(COL.outfit,0.82), mPants=mat(COL.pants,0.9), mGlove=mat(COL.glove,0.7),
        mScarf=new T.MeshStandardMaterial({color:COL.scarf,roughness:0.5,emissive:0x6a4d05,emissiveIntensity:0.5}),
        mHair=mat(COL.hair,0.5), mSkin=mat(COL.skin,0.72), mStrap=mat(COL.strap,0.8),
        mBand=mat(COL.band,0.45), mBoot=mat(COL.glove,0.6);
  const HIP_Y=0.92, SHO_Y=1.66;
  body.add(at(pmesh(new T.CylinderGeometry(0.30,0.26,0.24,12),mPants),0,HIP_Y,0));
  body.add(at(pmesh(new T.CylinderGeometry(0.28,0.32,0.62,12),mOutfit),0,HIP_Y+0.44,0));
  const chest=pmesh(new T.SphereGeometry(0.30,14,12),mOutfit); chest.position.y=SHO_Y-0.12; chest.scale.set(1,0.8,0.9); body.add(chest);
  const belt=pmesh(new T.TorusGeometry(0.30,0.055,8,20),mStrap); belt.position.y=HIP_Y+0.14; belt.rotation.x=Math.PI/2; body.add(belt);
  const buckle=pmesh(new T.BoxGeometry(0.13,0.10,0.05),mScarf); buckle.position.set(0,HIP_Y+0.14,0.31); body.add(buckle);
  for(const [rz,zs] of [[0.55,0.30],[-0.55,0.30],[0.55,-0.30],[-0.55,-0.30]]){
    const st=pmesh(new T.BoxGeometry(0.075,1.05,0.04),mStrap); st.position.set(0,HIP_Y+0.58,zs); st.rotation.z=rz; body.add(st);
  }
  // head
  const head=new T.Group(); head.position.y=SHO_Y+0.10; body.add(head);
  const skull=pmesh(new T.SphereGeometry(0.245,18,16),mSkin); skull.scale.set(1,1.05,0.98); head.add(skull);
  for(const sx of [-1,1]){ const eye=pmesh(new T.SphereGeometry(0.032,8,8),mat(0x141414,0.4)); eye.position.set(sx*0.085,0.02,0.225); head.add(eye); }
  const band=pmesh(new T.TorusGeometry(0.245,0.045,8,22),mBand); band.position.y=0.10; band.rotation.x=Math.PI/2; band.scale.set(1,0.85,1); head.add(band);
  head.add(at(pmesh(new T.BoxGeometry(0.10,0.08,0.06),mBand),-0.22,0.11,-0.06));
  const hairBase=pmesh(new T.SphereGeometry(0.255,16,14),mHair); hairBase.position.y=0.10; hairBase.scale.set(1.03,0.9,1.03); head.add(hairBase);
  for(const [x,y,z,tilt] of [[0,0.30,-0.02,0.1],[-0.14,0.27,0.02,-0.4],[0.15,0.26,0,0.5],[-0.05,0.28,-0.16,-0.2],[0.08,0.25,-0.17,0.3],[-0.20,0.20,-0.06,-0.8],[0.21,0.19,-0.05,0.8],[0.02,0.22,0.16,0.05],[-0.12,0.20,0.14,-0.3]]){
    const s=pmesh(new T.ConeGeometry(0.085,0.30,6),mHair); s.position.set(x,y,z); s.rotation.z=tilt; s.rotation.x=-0.3+(z<0?-0.5:0.2); head.add(s);
  }
  // scarf: collar + trailing tail
  const collar=pmesh(new T.TorusGeometry(0.235,0.075,8,20),mScarf); collar.position.y=SHO_Y-0.01; collar.rotation.x=Math.PI/2; collar.scale.set(1,0.9,1); body.add(collar);
  body.add(at(pmesh(new T.SphereGeometry(0.10,10,10),mScarf),0.16,SHO_Y-0.06,0.16));
  const scarfRoot=new T.Group(); scarfRoot.position.set(0.12,SHO_Y-0.06,-0.15); body.add(scarfRoot);
  const scarf=[]; { let parent=scarfRoot;
    for(let i=0;i<6;i++){ const seg=new T.Group(); const w=0.24-i*0.028;
      const panel=pmesh(new T.BoxGeometry(w,0.22,0.05),mScarf); panel.position.y=-0.11; seg.add(panel);
      seg.position.set(0, i===0?-0.06:-0.20, i===0?-0.08:-0.03); seg.rotation.x=-0.05; parent.add(seg); scarf.push(seg); parent=seg; } }
  // loot bag on back
  const bag=new T.Group(); bag.position.set(0.05,SHO_Y-0.35,-0.34); body.add(bag);
  const sack=pmesh(new T.SphereGeometry(0.26,14,12),mat(COL.bag,0.95)); sack.scale.set(1,1.12,0.9); bag.add(sack);
  const tie=pmesh(new T.TorusGeometry(0.12,0.035,8,16),mat(COL.bagDk,0.9)); tie.position.y=0.24; tie.rotation.x=Math.PI/2; bag.add(tie);
  bag.scale.setScalar(0.55);
  // arms + legs (pivots for animation)
  function arm(side){ const sho=new T.Group(); sho.position.set(side*0.34,SHO_Y-0.04,0); body.add(sho);
    sho.add(limb(0.42,0.10,0.085,mOutfit)); const elbow=new T.Group(); elbow.position.y=-0.42; sho.add(elbow);
    elbow.add(limb(0.40,0.085,0.07,mOutfit)); const glove=pmesh(new T.SphereGeometry(0.10,10,10),mGlove); glove.position.y=-0.40; glove.scale.set(1,1.1,1); elbow.add(glove);
    return {sho,elbow}; }
  function leg(side){ const hip=new T.Group(); hip.position.set(side*0.14,HIP_Y-0.04,0); body.add(hip);
    hip.add(limb(0.44,0.13,0.11,mPants)); const knee=new T.Group(); knee.position.y=-0.44; hip.add(knee);
    knee.add(limb(0.44,0.10,0.085,mPants)); const boot=pmesh(new T.BoxGeometry(0.20,0.16,0.34),mBoot); boot.position.set(0,-0.46,0.06); knee.add(boot);
    return {hip,knee}; }
  const rig = { body, head, scarf, armL:arm(-1), armR:arm(1), legL:leg(-1), legR:leg(1) };

  return {
    root, bag, kind:'primitive rig',
    update(dt, loco){
      const p = solveLocomotion(loco.speed01, loco.phase, loco.tSec);
      rig.legL.hip.rotation.x=p.hip[0];  rig.legR.hip.rotation.x=p.hip[1];
      rig.legL.knee.rotation.x=p.knee[0]; rig.legR.knee.rotation.x=p.knee[1];
      rig.armL.sho.rotation.x=p.shoulder[0]; rig.armR.sho.rotation.x=p.shoulder[1];
      rig.armL.elbow.rotation.x=p.elbow[0];  rig.armR.elbow.rotation.x=p.elbow[1];
      rig.body.position.y=p.bobY; rig.body.rotation.x=p.leanX; rig.body.rotation.z=p.rollZ;
      rig.body.scale.y=1+p.breathe; rig.head.rotation.z=p.headZ;
      const t=loco.tSec;
      for(let i=0;i<rig.scarf.length;i++){ const s=rig.scarf[i];
        s.rotation.y=Math.sin(t*1.1-i*0.6)*0.09*(0.6+i*0.14);
        s.rotation.x=-0.05+p.scarfLift+Math.sin(t*1.4-i*0.7)*0.09*(1+i*0.26); }
    }
  };
}

// glTF actor: baked clips -> a 1-D locomotion blend tree (idle -> walk -> run by speed).
// This is the "real model" path: an artist/Mixamo export drops straight into the same controller.
function ClipActor(gltf){
  const root = new T.Group(); scene.add(root);
  const model = gltf.scene; normalizeModel(model); root.add(model);
  const mixer = new T.AnimationMixer(model);
  const clips = gltf.animations||[];
  const find = re => clips.find(c=>re.test(c.name));
  const cIdle = find(/idle|breath|stand/i);
  const cWalk = find(/walk/i) || find(/run|jog/i) || cIdle;
  const cRun  = find(/run|jog|sprint/i) || cWalk;
  const mk = c => { if(!c) return null; const a=mixer.clipAction(c); a.play(); a.enabled=true; a.setEffectiveWeight(0); return a; };
  const aIdle=mk(cIdle), aWalk=mk(cWalk), aRun=mk(cRun);
  const bag = model.getObjectByName('bag') || model.getObjectByName('Bag') || null;
  return {
    root, bag, kind:'glTF · baked clips',
    update(dt, loco){
      const sp = loco.speed01;
      let wi=0, ww=0, wr=0;
      if(sp < 0.5){ ww = smoothstep(0,0.5,sp); wi = 1-ww; }
      else { wr = smoothstep(0.5,1,sp); ww = 1-wr; }
      if(aIdle) aIdle.setEffectiveWeight(wi);
      if(aWalk){ aWalk.setEffectiveWeight(ww); aWalk.setEffectiveTimeScale(0.8+sp*0.9); }
      if(aRun){  aRun.setEffectiveWeight(wr);  aRun.setEffectiveTimeScale(0.9+sp*0.6); }
      mixer.update(dt);
    }
  };
}

// glTF actor: rigged but NO clips -> drive its humanoid bones from solveLocomotion().
function BoneActor(gltf, bones){
  const root=new T.Group(); scene.add(root); const model=gltf.scene; normalizeModel(model); root.add(model);
  const rest={}; for(const k in bones) if(bones[k]) rest[k]=bones[k].rotation.clone();
  const setX=(b,base,ang)=>{ if(b) b.rotation.set(base.x+ang, base.y, base.z); };
  return { root, bag:model.getObjectByName('bag')||null, kind:'glTF · procedural bones',
    update(dt, loco){ const p=solveLocomotion(loco.speed01,loco.phase,loco.tSec);
      setX(bones.upLegL,rest.upLegL,p.hip[0]);  setX(bones.upLegR,rest.upLegR,p.hip[1]);
      setX(bones.legL,rest.legL,p.knee[0]);     setX(bones.legR,rest.legR,p.knee[1]);
      setX(bones.armL,rest.armL,p.shoulder[0]); setX(bones.armR,rest.armR,p.shoulder[1]);
      setX(bones.foreL,rest.foreL,p.elbow[0]+0.25); setX(bones.foreR,rest.foreR,p.elbow[1]+0.25);
    } };
}

// Fit any imported model to Jo's scale: ~1.85 units tall, feet at y=0, centered.
function normalizeModel(model){
  model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  const box=new T.Box3().setFromObject(model), size=new T.Vector3(); box.getSize(size);
  const s = size.y>0 ? 1.85/size.y : 1; model.scale.setScalar(s);
  const box2=new T.Box3().setFromObject(model), c=new T.Vector3(); box2.getCenter(c);
  model.position.x-=c.x; model.position.z-=c.z; model.position.y-=box2.min.y;
}
function findBone(model, re){ let f=null; model.traverse(o=>{ if(!f && (o.isBone||o.type==='Bone') && re.test(o.name)) f=o; }); return f; }

// Choose the actor: a real model at assets/jo.glb if present, else the primitive Jo.
function loadJo(){
  return new Promise(resolve=>{
    if(!T.GLTFLoader){ resolve(PrimitiveActor()); return; }
    new T.GLTFLoader().load('assets/jo.glb',
      gltf=>{
        try{
          if((gltf.animations||[]).length){ resolve(ClipActor(gltf)); return; }
          const bones={ upLegL:findBone(gltf.scene,/(left|_l\b|l).*(upleg|thigh|upperleg)/i)||findBone(gltf.scene,/leftupleg/i),
                        upLegR:findBone(gltf.scene,/(right|_r\b|r).*(upleg|thigh|upperleg)/i)||findBone(gltf.scene,/rightupleg/i),
                        legL:findBone(gltf.scene,/leftleg|left.*shin|left.*lowerleg/i), legR:findBone(gltf.scene,/rightleg|right.*shin|right.*lowerleg/i),
                        armL:findBone(gltf.scene,/leftarm|left.*upperarm/i), armR:findBone(gltf.scene,/rightarm|right.*upperarm/i),
                        foreL:findBone(gltf.scene,/leftforearm|left.*lowerarm/i), foreR:findBone(gltf.scene,/rightforearm|right.*lowerarm/i) };
          if(bones.upLegL && bones.upLegR){ resolve(BoneActor(gltf,bones)); return; }
          // model present but not rig-drivable: just show it with an idle bob
          const root=new T.Group(); scene.add(root); normalizeModel(gltf.scene); root.add(gltf.scene);
          resolve({ root, bag:null, kind:'glTF · static', update(dt,loco){ root.children[0].position.y = Math.sin(loco.tSec*2.2)*0.02; } });
        }catch(e){ console.warn('glTF load issue, using primitive Jo:', e); resolve(PrimitiveActor()); }
      },
      undefined,
      ()=> resolve(PrimitiveActor())   // no assets/jo.glb -> primitive stand-in
    );
  });
}

// ================================================================
//  LOOT (gold to grab; the bag grows with the haul)
// ================================================================
const coins=[]; const coinGeo=new T.CylinderGeometry(0.22,0.22,0.06,18);
const coinMat=new T.MeshStandardMaterial({color:0xffcf3f, roughness:0.35, metalness:0.7, emissive:0x5a3d00, emissiveIntensity:0.6});
for(let i=0;i<24;i++){ const holder=new T.Group(); let x,z; do{ x=(Math.random()*2-1)*15; z=(Math.random()*2-1)*15; }while(Math.hypot(x,z)<2.5);
  const c=pmesh(coinGeo,coinMat); c.rotation.x=Math.PI/2; holder.position.set(x,0.5,z); holder.add(c);
  const glow=new T.Mesh(new T.CircleGeometry(0.5,20), new T.MeshBasicMaterial({color:0xffcf3f,transparent:true,opacity:0.11}));
  glow.rotation.x=-Math.PI/2; glow.position.set(x,0.03,z); scene.add(glow);
  holder.userData.glow=glow; scene.add(holder); coins.push(holder); }

// ================================================================
//  CONTROLLER — input -> eased velocity -> movement, turning, stride
//  phase; then hands a locomotion snapshot to whatever actor is loaded.
// ================================================================
const keys=new Set();
addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const touchVec={x:0,y:0}; let drag=null; const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y, m=Math.hypot(dx,dy)||1, s=Math.min(1,m/70); touchVec.x=dx/m*s; touchVec.y=dy/m*s; });
const endDrag=()=>{ drag=null; touchVec.x=touchVec.y=0; };
el.addEventListener('pointerup',endDrag); el.addEventListener('pointercancel',endDrag);

const MAXSPEED=6.0, STRIDE_K=2.85, ACCEL=9, TURN=11;
const vel=new T.Vector2(0,0); let phase=0, yaw=0, haul=0, load=0;
const $=id=>document.getElementById(id);
function setLoad(n){ load=n; if(actor && actor.bag) actor.bag.scale.setScalar(0.55+Math.min(load,40)*0.02);
  $('loadFill').style.width=Math.min(100,load/40*100)+'%';
  $('loadTxt').textContent = load<6?'Light': load<16?'Laden': load<28?'Heavy':'Backbreaking'; }

let actor=null;
loadJo().then(a=>{ actor=a; $('stateSrc').textContent=a.kind; });

let last=performance.now();
function tick(now){
  const dt=Math.min(0.033,(now-last)/1000); last=now; const tSec=now/1000;
  // input -> target velocity
  let ix=0, iz=0;
  if(keys.has('w')||keys.has('arrowup'))iz-=1; if(keys.has('s')||keys.has('arrowdown'))iz+=1;
  if(keys.has('a')||keys.has('arrowleft'))ix-=1; if(keys.has('d')||keys.has('arrowright'))ix+=1;
  ix+=touchVec.x; iz+=touchVec.y; let m=Math.hypot(ix,iz); if(m>1){ ix/=m; iz/=m; m=1; }
  // ease velocity toward target (accel + decel) -> fluid starts/stops
  vel.x=damp(vel.x, ix*MAXSPEED, ACCEL, dt); vel.y=damp(vel.y, iz*MAXSPEED, ACCEL, dt);
  const spd=Math.hypot(vel.x,vel.y), speed01=clamp(spd/MAXSPEED,0,1);
  if(actor){
    // move + clamp
    actor.root.position.x=clamp(actor.root.position.x+vel.x*dt,-BOUND,BOUND);
    actor.root.position.z=clamp(actor.root.position.z+vel.y*dt,-BOUND,BOUND);
    if(spd>0.05) yaw=dampAngle(yaw, Math.atan2(vel.x,vel.y), TURN, dt);   // face heading (model faces +Z)
    actor.root.rotation.y=yaw;
    phase += spd*dt*STRIDE_K;                                              // distance-locked stride: no skate
    const state = speed01<0.05?'IDLE': speed01<0.55?'WALK':'RUN';
    actor.update(dt, { speed01, phase, tSec, state });
    // camera follow
    camera.position.lerp(new T.Vector3().copy(actor.root.position).add(camOffset), 1-Math.pow(0.002,dt));
    camera.lookAt(actor.root.position.x,1.1,actor.root.position.z);
    key.target.position.set(actor.root.position.x,0,actor.root.position.z);
    // coins
    for(const c of coins){ if(!c.visible) continue; c.children[0].rotation.z+=dt*2.2; c.position.y=0.5+Math.sin(now*0.004+c.position.x)*0.06;
      const dx=c.position.x-actor.root.position.x, dz=c.position.z-actor.root.position.z;
      if(dx*dx+dz*dz<1.3){ c.visible=false; if(c.userData.glow) c.userData.glow.visible=false; haul+=60; setLoad(load+1); $('haulVal').textContent='$'+haul.toLocaleString(); } }
    // HUD state readout
    $('stateName').textContent=state; $('stateFill').style.width=(speed01*100)+'%';
  }
  renderer.render(scene,camera); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
})();
</script>
</body>
</html>
